<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant emerald-to-electric-blue gradient with violet accents -->
    <linearGradient id="weegoosEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="75%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Secondary dynamic gradient for the speed/motion vector -->
    <linearGradient id="motionAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>

  <!-- Transparent background container -->
  <g transform="translate(256, 256) scale(1) translate(-256, -256)">
    
    <!-- Stylized 'W' Emblem Formed by Modular Hexagons and Negative Space -->
    <g fill="url(#weegoosEmblemGrad)">
      
      <!-- Left Hexagonal Stem -->
      <path d="M 112 152 
               L 156 128 
               L 196 152 
               L 196 280 
               L 156 304 
               L 112 280 Z" />

      <!-- Center-Left Upward Hexagonal Node -->
      <path d="M 176 216 
               L 220 192 
               L 260 216 
               L 260 344 
               L 220 368 
               L 176 344 Z" />

      <!-- Center-Right Upward Hexagonal Node -->
      <path d="M 252 216 
               L 296 192 
               L 336 216 
               L 336 344 
               L 296 368 
               L 252 344 Z" />

      <!-- Right Hexagonal Stem -->
      <path d="M 316 152 
               L 360 128 
               L 400 152 
               L 400 280 
               L 360 304 
               L 316 280 Z" />

    </g>

    <!-- Dynamic Forward Motion & Lightning-Inspired Slits (Negative Space / Geometric Cuts) -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="8" opacity="0.85">
      
      <!-- Forward velocity slash cutting through the structure -->
      <path d="M 140 236 L 372 176" />
      
      <!-- Secondary momentum track symbolizing speed and modular flow -->
      <path d="M 152 284 L 360 228" />

    </g>

  </g>
</svg>
